name: EarnKaro offer sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricevichar-catalog-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out PriceVichar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync recent converted offers
        run: python3 scripts/sync-earnkaro-telegram.py

      - name: Validate offer catalog
        run: npm ci && npm test

      - name: Publish changed offers
        run: |
          git config user.name "PriceVichar Offer Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/earnkaro-offers.json public/earnkaro-live

          if git diff --cached --quiet; then
            echo "No offer changes to publish."
            exit 0
          fi

          git commit -m "Refresh EarnKaro offers $(date -u +%F-%H%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
