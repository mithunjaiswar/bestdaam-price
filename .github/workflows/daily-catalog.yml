name: Daily PriceVichar catalog refresh

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricevichar-catalog-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HEADLESS: "true"
      BESTDAAM_SITE_DIR: ${{ github.workspace }}/site
      EKARO_API_TOKEN: ${{ secrets.EKARO_API_TOKEN }}
      PRODUCT_REQUESTS_API_URL: ${{ secrets.PRODUCT_REQUESTS_API_URL }}
      PRODUCT_REQUESTS_API_TOKEN: ${{ secrets.PRODUCT_REQUESTS_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
      AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
      AMAZON_CREATORS_CREDENTIAL_VERSION: "3.2"
      AMAZON_ASSOCIATE_TAG: "bestdaam0a-21"

    steps:
      - name: Check out PriceVichar
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0

      - name: Check out catalog automation
        uses: actions/checkout@v4
        with:
          repository: mithunjaiswar/bestdaam-scraper
          path: scraper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install catalog dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Refresh catalog safely
        working-directory: scraper
        run: python cloud_update.py --site-dir ../site

      - name: Sync recent EarnKaro offers
        working-directory: site
        run: python scripts/sync-earnkaro-telegram.py

      - name: Validate website build
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build

      - name: Publish validated catalog
        working-directory: site
        run: |
          git config user.name "PriceVichar Daily Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json data/earnkaro-offers.json public/earnkaro-live

          if git diff --cached --quiet; then
            echo "No catalog changes to publish."
            exit 0
          fi

          git commit -m "Daily cloud catalog refresh $(date -u +%F)"
          git push
