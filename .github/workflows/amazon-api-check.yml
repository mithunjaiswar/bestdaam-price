name: Amazon Creators API check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BESTDAAM_SITE_DIR: ${{ github.workspace }}/site
      AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
      AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
      AMAZON_CREATORS_CREDENTIAL_VERSION: "3.2"
      AMAZON_ASSOCIATE_TAG: "bestdaam0a-21"

    steps:
      - name: Check out PriceVichar
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out Amazon integration
        uses: actions/checkout@v4
        with:
          repository: mithunjaiswar/bestdaam-scraper
          path: scraper

      - name: Test live Amazon catalog access
        working-directory: scraper
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.4
          python refresh_amazon_creators.py
