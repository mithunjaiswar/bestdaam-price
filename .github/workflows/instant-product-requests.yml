name: Fast product request update

on:
  schedule:
    # Safety fallback. Normal requests trigger this workflow immediately
    # from Google Apps Script, so frequent polling is unnecessary.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Share one writer lock with the daily catalog and EarnKaro workflows so
  # two automations never try to publish catalog changes at the same time.
  group: pricevichar-catalog-writer
  cancel-in-progress: false

jobs:
  publish-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEADLESS: "true"
      BESTDAAM_SITE_DIR: ${{ github.workspace }}/site
      EKARO_API_TOKEN: ${{ secrets.EKARO_API_TOKEN }}
      PRODUCT_REQUESTS_API_URL: ${{ secrets.PRODUCT_REQUESTS_API_URL }}
      PRODUCT_REQUESTS_API_TOKEN: ${{ secrets.PRODUCT_REQUESTS_API_TOKEN }}

    steps:
      - name: Check out BestDaam
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0

      - name: Check out catalog automation
        uses: actions/checkout@v4
        with:
          repository: mithunjaiswar/bestdaam-scraper
          path: scraper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install request processor
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Restore current catalog history
        working-directory: scraper
        run: python hydrate_database_from_catalog.py

      - name: Process pending customer requests
        working-directory: scraper
        run: |
          # Google Apps Script occasionally returns a short-lived 404 from its
          # redirect host. Retry the same stable deployment before failing the
          # scheduled job.
          for attempt in 1 2 3; do
            if python process_product_requests.py; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Product request API failed after 3 attempts."
              exit 1
            fi

            wait_seconds=$((attempt * 15))
            echo "Product request API attempt $attempt failed; retrying in ${wait_seconds}s."
            sleep "$wait_seconds"
          done

      - name: Export requested products
        working-directory: scraper
        run: |
          python export_catalog_to_bestdaam.py
          python apply_ekaro_api_links.py

      - name: Validate website
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build

      - name: Publish validated products
        working-directory: site
        run: |
          git config user.name "BestDaam Request Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json

          if git diff --cached --quiet; then
            echo "No new catalog product to publish."
          else
            git commit -m "Add requested customer products"
            # The scraper can leave generated files outside the publish set.
            # Keep the validated catalog commit, but move those ephemeral
            # changes aside so rebase can run cleanly in this disposable job.
            git stash push --include-untracked -m "request-automation-generated-files" || true
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Update request queue statuses
        working-directory: scraper
        run: python publish_product_request_statuses.py
