name: Fast product request update

on:
  schedule:
    # Safety fallback. Normal requests trigger this workflow immediately
    # from Google Apps Script, so frequent polling is unnecessary.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bestdaam-catalog-writer
  cancel-in-progress: false

jobs:
  publish-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEADLESS: "true"
      BESTDAAM_SITE_DIR: ${{ github.workspace }}/site
      EKARO_API_TOKEN: ${{ secrets.EKARO_API_TOKEN }}
      PRODUCT_REQUESTS_API_URL: ${{ secrets.PRODUCT_REQUESTS_API_URL }}
      PRODUCT_REQUESTS_API_TOKEN: ${{ secrets.PRODUCT_REQUESTS_API_TOKEN }}

    steps:
      - name: Check out BestDaam
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0

      - name: Check out catalog automation
        uses: actions/checkout@v4
        with:
          repository: mithunjaiswar/bestdaam-scraper
          path: scraper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install request processor
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Restore current catalog history
        working-directory: scraper
        run: python hydrate_database_from_catalog.py

      - name: Process pending customer requests
        working-directory: scraper
        run: python process_product_requests.py

      - name: Export requested products
        working-directory: scraper
        run: |
          python export_catalog_to_bestdaam.py
          python apply_ekaro_api_links.py

      - name: Validate website
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Publish validated products
        working-directory: site
        run: |
          git config user.name "BestDaam Request Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json

          if git diff --cached --quiet; then
            echo "No new catalog product to publish."
          else
            git commit -m "Add requested customer products"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Update request queue statuses
        working-directory: scraper
        run: python publish_product_request_statuses.py
